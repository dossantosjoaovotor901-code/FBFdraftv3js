<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#fffdf7">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBF - Football Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/gfx.js"></script>
</head>
<body>

<!-- ===== Topbar ===== -->
<header id="topbar" class="hidden">
  <div class="brand" data-nav="home">
    <img class="brand-logo" src="/img/fbf-logo.webp" alt="FBF" onerror="this.style.display='none'">
    <span class="logo">FBF</span>
    <span class="brand-tag">Football Draft</span>
  </div>
  <div class="user-box">
    <span class="coins" id="topCoins">0 <b>FBF</b></span>
    <img id="topAvatar" class="avatar" alt="" src="/img/avatar.svg">
    <span id="topName" class="uname"></span>
  </div>
</header>

<!-- ===== Banner de evento (preenchido pelo JS) ===== -->
<div id="eventBanner" class="event-banner hidden"></div>

<!-- ===== Menu completo (overlay deslizante) ===== -->
<nav id="mainnav">
  <a data-nav="home">Inicio</a>
  <a data-nav="online">Online</a>
  <a data-nav="bots">Bots</a>
  <a data-nav="draft">Montar Draft</a>
  <a data-nav="packs">Pacotes</a>
  <a data-nav="collection">Minhas cartas</a>
  <a data-nav="catalog">Cartas do jogo</a>
  <a data-nav="selfcard">Minha Carta</a>
  <a data-nav="cashshop">Lojinha</a>
  <a data-nav="team">Meu time</a>
  <a data-nav="market">Mercado</a>
  <a data-nav="config">Configuracao</a>
  <a data-nav="profile">Perfil</a>
  <a data-nav="admin" id="nav-admin" class="hidden adminlink">Admin</a>
</nav>

<main id="app"></main>

<!-- ===== Navegacao inferior fixa ===== -->
<nav id="bottomnav" class="hidden">
  <a data-nav="home"><span class="bn-ic" data-icon="home"></span><span class="bn-lb">Inicio</span></a>
  <a data-nav="packs"><span class="bn-ic" data-icon="gift"></span><span class="bn-lb">Pacotes</span></a>
  <a data-nav="online" class="bn-play"><span class="bn-ic" data-icon="ball"></span><span class="bn-lb">Online</span></a>
  <a data-nav="collection"><span class="bn-ic" data-icon="cards"></span><span class="bn-lb">Cartas</span></a>
  <button id="menuToggle" class="bn-more" aria-label="menu"><span class="bn-ic" data-icon="menu"></span><span class="bn-lb">Mais</span></button>
</nav>

<!-- ===== Modal generico ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Fechar" data-icon="close"></button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="/js/icons.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/events.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/squad.js"></script>
<script src="/js/draft.js"></script>
<script src="/js/sim.js"></script>
<script src="/js/match.js"></script>
<script src="/js/online.js"></script>
<script src="/js/bots.js"></script>
<script src="/js/selfcard.js"></script>
<script src="/js/cashshop.js"></script>
<script src="/js/config.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
